name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.18+6c83a7f62
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run cmd/main --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/evaluate --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/csv --target ${{ matrix.target }} --deny-warn
      - run: moon run cmd/inspect --target ${{ matrix.target }} -- arithmetic '1+2*3'
      - name: Check public interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 0.10.18+6c83a7f62
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Regenerate upstream artifacts and reference cases
        run: |
          mkdir -p .local
          curl -fLsS --retry 3 -o .local/antlr.jar https://www.antlr.org/download/antlr-4.13.2-complete.jar
          python tools/generate.py grammars/Json.g4 --output generated/json --jar .local/antlr.jar
          python tools/generate.py grammars/Arithmetic.g4 --output generated/arithmetic --jar .local/antlr.jar
          python tools/generate.py grammars/Csv.g4 --output generated/csv --jar .local/antlr.jar
          python tools/generate.py grammars/Precedence.g4 --output generated/precedence --jar .local/antlr.jar
          python tools/generate.py grammars/NonGreedy.g4 --output generated/nongreedy --jar .local/antlr.jar
          python tools/generate.py grammars/Predicate.g4 --output generated/predicate --jar .local/antlr.jar
          python tools/generate.py grammars/ModesParser.g4 --lexer grammars/ModesLexer.g4 --output generated/modes --jar .local/antlr.jar
          python tools/oracle.py --jar .local/antlr.jar
          moon fmt
          git diff --exit-code -- generated tests
      - run: moon test --deny-warn
      - run: python tools/check_cli.py
