name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 1.0.0-rc1+3c0520448
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: python3 tools/check_toolchain.py
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run cmd/main --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/evaluate --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/csv --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/csharp --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/typed --target ${{ matrix.target }} --deny-warn
      - if: matrix.target == 'wasm-gc'
        run: node tools/check_editor.mjs
      - run: moon run cmd/inspect --target ${{ matrix.target }} -- arithmetic '1+2*3'
      - run: python3 tools/check_cli.py --target ${{ matrix.target }}
      - name: Check public interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- 1.0.0-rc1+3c0520448
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: python3 tools/check_toolchain.py
      - run: moon update
      - name: Regenerate upstream artifacts and reference cases
        run: |
          mkdir -p .local
          curl -fLsS --retry 3 -o .local/antlr.jar https://www.antlr.org/download/antlr-4.13.2-complete.jar
          python tools/generate.py grammars/Json.g4 --output generated/json --jar .local/antlr.jar
          python tools/generate.py grammars/Arithmetic.g4 --output generated/arithmetic --jar .local/antlr.jar
          python tools/generate.py grammars/Csv.g4 --output generated/csv --jar .local/antlr.jar
          python tools/generate.py grammars/Precedence.g4 --output generated/precedence --jar .local/antlr.jar
          python tools/generate.py grammars/Recursion.g4 --output generated/recursion --jar .local/antlr.jar
          python tools/generate_target.py grammars/Typed.g4 --output generated/typed --jar .local/antlr.jar
          python tools/generate_target.py grammars/Decisions.g4 --output generated/decisions --jar .local/antlr.jar
          python tools/generate.py grammars/NonGreedy.g4 --output generated/nongreedy --jar .local/antlr.jar
          python tools/generate_target.py grammars/Predicate.g4 --output generated/predicate --jar .local/antlr.jar
          python tools/generate.py grammars/ModesParser.g4 --lexer grammars/ModesLexer.g4 --output generated/modes --jar .local/antlr.jar
          python tools/generate_target.py grammars/LexGate.g4 --output generated/lexgate --jar .local/antlr.jar
          python tools/generate_target.py grammars/LexActions.g4 --output generated/lexactions --jar .local/antlr.jar
          python tools/generate_target.py grammars/ParseActions.g4 --output generated/parseactions --jar .local/antlr.jar
          python tools/generate_target.py grammars/StatefulParser.g4 --lexer grammars/StatefulLexer.g4 --output generated/stateful --jar .local/antlr.jar
          python tools/generate_target.py grammars/Attributes.g4 --output generated/attributes --jar .local/antlr.jar
          python tools/generate_target.py grammars/Lifecycle.g4 --output generated/lifecycle --jar .local/antlr.jar
          python tools/generate_target.py grammars/Exceptions.g4 --output generated/exceptions --jar .local/antlr.jar
          python tools/generate_target.py grammars/Control.g4 --output generated/control --jar .local/antlr.jar
          python tools/generate_target.py grammars/Differential.g4 --output generated/differential --jar .local/antlr.jar
          python tools/generate_target.py grammars/UnicodeModesLexer.g4 --output generated/unicode_modes_lexer --jar .local/antlr.jar
          python tools/generate_target.py grammars/SemanticDifferential.g4 --output generated/semantic_differential --jar .local/antlr.jar
          python tools/generate_target.py grammars/OptionsParser.g4 --lexer grammars/OptionsLexer.g4 --output generated/options --jar .local/antlr.jar
          python tools/generate_target.py grammars/csharp/CSharpParser.g4 --lexer grammars/csharp/CSharpLexer.g4 --output generated/csharp --jar .local/antlr.jar
          python tools/generate_target.py grammars/csharp/CSharpPreprocessorParser.g4 --lexer grammars/csharp/CSharpLexer.g4 --output generated/csharp_preprocessor --jar .local/antlr.jar
          python tools/csharp_oracle.py --jar .local/antlr.jar
          python tools/upstream_oracle.py --jar .local/antlr.jar
          python tools/oracle.py --jar .local/antlr.jar
          python tools/lifecycle_oracle.py --jar .local/antlr.jar
          python tools/control_oracle.py --jar .local/antlr.jar
          python tools/differential_oracle.py --jar .local/antlr.jar
          python tools/check_target.py --jar .local/antlr.jar
          moon check --deny-warn
          moon fmt
          git diff --exit-code -- generated tests csharp conformance
      - run: moon test --deny-warn
      - run: python tools/check_cli.py
